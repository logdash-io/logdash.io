name: Run Tests on PR

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'apps/backend/**'
      - '.github/workflows/**'
      - '.github/templates/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/backend

      - name: Type check
        run: npm run check
        working-directory: apps/backend

      - name: Lint
        run: npm run lint
        working-directory: apps/backend

      - name: Check the status page OpenAPI spec is up to date
        run: |
          npm run openapi:export
          git diff --exit-code -- openapi || {
            echo "::error::openapi/status-page-v1.json is out of date. Run 'npm run openapi:export' in apps/backend and commit the result."
            exit 1
          }
        working-directory: apps/backend

  find-tests:
    runs-on: ubuntu-latest
    outputs:
      test-batches: ${{ steps.find-tests.outputs.test-batches }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find test files
        id: find-tests
        uses: './.github/templates/find-tests'
        with:
          batch-size: '3'

  test:
    needs: find-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-batch: ${{ fromJson(needs.find-tests.outputs.test-batches) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run test batch
        uses: './.github/templates/test'
        with:
          test-batch: ${{ matrix.test-batch }}
