name: Check Status Page Contract on PR

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'apps/backend/src/**'
      - 'apps/backend/openapi/**'
      - 'packages/status/**'
      - 'apps/frontend/static/r/**'
      - 'templates/**'
      - '.github/workflows/status-contract-check-on-pr.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm

      # The spec comes from the backend's own npm install, like in its CI and
      # Docker image, since its lockfile differs from the pnpm one.
      - name: Install backend dependencies
        run: npm ci
        working-directory: apps/backend

      - name: Generate the OpenAPI spec
        run: npm run openapi:export
        working-directory: apps/backend

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate types
        run: pnpm --filter @logdash/status generate

      - name: Build the component registry
        run: pnpm --filter @logdash/status registry:build

      - name: Fail on stale generated files
        run: |
          paths=(apps/backend/openapi packages/status/src/api.generated.ts apps/frontend/static/r)
          git add --intent-to-add -- "${paths[@]}"
          if ! git diff --exit-code -- "${paths[@]}"; then
            echo "::error::Generated files are stale. Run 'npm run openapi:export' in apps/backend, then 'pnpm --filter @logdash/status generate' and 'registry:build', and commit the result."
            exit 1
          fi

      - name: Type check
        run: pnpm --filter @logdash/status check

      - name: Type check the component registry
        run: pnpm --filter @logdash/status registry:check

      - name: Test
        run: pnpm --filter @logdash/status test

      - name: Build
        run: pnpm --filter @logdash/status build

      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP/status"
        working-directory: packages/status

      - name: Check the tarball contents
        run: |
          tar -tzf "$RUNNER_TEMP"/status/logdash-status-*.tgz
          if tar -tzf "$RUNNER_TEMP"/status/logdash-status-*.tgz | grep -Eq '^package/(src|registry)/'; then
            echo "::error::The tarball must only ship dist."
            exit 1
          fi

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: status-package
          path: ${{ runner.temp }}/status/*.tgz

  starter:
    needs: package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/status-page-next
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Starter component matches the registry
        run: diff components/status-page.tsx ../../packages/status/registry/react/status-page.tsx

      - name: Download the tarball
        uses: actions/download-artifact@v4
        with:
          name: status-package
          path: ${{ runner.temp }}/status

      # setup-node v5 turns on caching for the root packageManager (pnpm),
      # which this job does not install. The starter uses npm and has no
      # lockfile to cache against.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      # Installs @logdash/status from the tarball, the way a customer gets it
      # from npm. No lockfile is committed until the first npm release.
      - name: Install dependencies
        run: npm install --no-save --no-audit --no-fund "$RUNNER_TEMP"/status/logdash-status-*.tgz

      # The page is prerendered at build time, so the build fetches a status
      # page. A local server answers with a sample so the build does not
      # depend on production.
      - name: Build
        run: |
          node -e '
            const day = 86400000;
            const today = Math.floor(Date.now() / day) * day;
            const page = {
              name: "Acme",
              status: "operational",
              updatedAt: new Date().toISOString(),
              monitors: [{
                id: "api",
                name: "API",
                status: "up",
                uptime: { "1h": 100, "24h": 100, "7d": 99.95, "30d": 99.98, "90d": 99.98 },
                history: {
                  daily: Array.from({ length: 90 }, (_, i) => ({
                    timestamp: new Date(today - (89 - i) * day).toISOString(),
                    successCount: i < 60 ? 0 : 1440,
                    failureCount: i === 80 ? 12 : 0,
                    averageLatencyMs: i < 60 ? null : 120,
                  })),
                },
                pings: [{ createdAt: new Date().toISOString(), statusCode: 200, responseTimeMs: 120 }],
              }],
            };
            require("node:http").createServer((req, res) => {
              res.setHeader("content-type", "application/json");
              res.end(JSON.stringify(page));
            }).listen(4010);
          ' &
          npm run build
        env:
          LOGDASH_STATUS_PAGE_ID: sample
          LOGDASH_API_URL: http://localhost:4010
          NEXT_TELEMETRY_DISABLED: 1
