name: Publish @logdash/status

on:
  push:
    tags:
      - 'status-v*'

permissions:
  contents: read
  # npm trusted publishing exchanges the workflow's OIDC token for a
  # short-lived publish token, so no npm secret is stored in the repository.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/status
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      # Node 24 ships an npm with trusted publishing support.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @logdash/status

      - name: Check the tag matches the package version
        run: |
          version="status-v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)."
            exit 1
          fi

      - name: Type check
        run: pnpm run check

      - name: Test
        run: pnpm test

      # pnpm pack applies publishConfig (exports pointing at dist) and runs
      # the build through prepack. Plain npm publish would ship the in-repo
      # exports that point at src.
      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP/status"

      - name: Publish
        run: npm publish "$RUNNER_TEMP"/status/logdash-status-*.tgz --access public
