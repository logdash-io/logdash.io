name: Check Status Page on PR

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'apps/status-page/**'
      - 'packages/**'
      - '.github/workflows/status-page-check-on-pr.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter status-page check

      - name: Lint
        run: pnpm --filter status-page lint
