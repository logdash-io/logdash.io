# ⚠️ SECURITY - READ BEFORE RE-ENABLING ARTIFACT UPLOAD ⚠️
#
# This repository is PUBLIC. GitHub Actions artifacts on a public repository can be
# downloaded by ANY GitHub user, so uploading a full production `mongodump` as an
# artifact publishes the entire production database. Encryption is the only thing that
# stood between that dump and the world, and it is a single shared passphrase.
#
# The "Upload Backup Artifact" step below is therefore gated behind an explicit
# `publish_artifact` workflow_dispatch input and is OFF for scheduled runs.
#
# TODO(security): replace the artifact sink with a private object store - push the
# encrypted dump to a private S3/R2 bucket with SSE-KMS and a bucket lifecycle policy,
# authenticating via OIDC role assumption rather than long-lived keys. Until that lands,
# scheduled runs produce NO retained backup: either finish this migration or disable the
# schedule. Do not simply flip `publish_artifact` on.
name: Mongo backup (prod)

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  workflow_dispatch:
    inputs:
      publish_artifact:
        description: '⚠️ Upload the encrypted backup as a PUBLICLY DOWNLOADABLE workflow artifact. Leave off unless you understand the exposure.'
        required: false
        default: false
        type: boolean

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MongoDB Tools
        run: |
          # Install MongoDB tools for mongodump
          wget -qO - https://www.mongodb.org/static/pgp/server-7.0.asc | sudo apt-key add -
          echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools
        shell: bash

      - name: Create MongoDB Backup
        run: |
          # Create backup directory
          mkdir -p backup

          # Get current timestamp for backup name
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_NAME="mongo_backup_prod_${TIMESTAMP}"

          echo "🔧 Starting MongoDB backup..."
          echo "📅 Backup timestamp: $TIMESTAMP"

          # Create MongoDB dump
          echo "🗄️ Creating MongoDB dump..."
          mongodump --uri="${{ secrets.BACKEND_PROD_MONGO_URL }}" --out=backup/mongodb_dump

          echo "✅ MongoDB dump completed"

          # Create metadata file
          echo "backup_timestamp=${TIMESTAMP}" > backup/metadata.txt
          echo "backup_type=mongodb" >> backup/metadata.txt
          echo "environment=prod" >> backup/metadata.txt
          echo "created_at=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> backup/metadata.txt

          # Compress backup
          echo "🗜️ Compressing backup..."
          tar -czf "${BACKUP_NAME}.tar.gz" backup/

          # Set output for artifact name
          echo "BACKUP_NAME=${BACKUP_NAME}" >> $GITHUB_ENV

          echo "✅ Backup compressed and ready for encryption"
        shell: bash

      - name: Encrypt Backup
        run: |
          echo "🔐 Encrypting backup artifact..."

          # Make script executable
          chmod +x .github/scripts/encrypt-backup.sh

          # Encrypt the backup
          ./.github/scripts/encrypt-backup.sh \
            "${BACKUP_NAME}.tar.gz" \
            "${BACKUP_NAME}.tar.gz.enc" \
            "${{ secrets.BACKEND_BACKUP_ARTIFACT_KEY }}"

          # Remove unencrypted file for security
          rm -f "${BACKUP_NAME}.tar.gz"

          echo "✅ Backup encrypted and ready for upload"
        shell: bash

      # ⚠️ Publishes production data to a PUBLIC repository's artifact storage.
      # Gated off by default - see the security note at the top of this file.
      - name: Upload Backup Artifact
        if: ${{ inputs.publish_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.tar.gz.enc
          retention-days: 14

      - name: Warn - backup not retained
        if: ${{ !inputs.publish_artifact }}
        run: |
          echo "::warning title=Backup not retained::Artifact upload is disabled because this is a public repository. The backup was created and discarded. See the TODO at the top of .github/workflows/backend-prod-mongo-backup.yml - a private S3/R2 sink still needs to be wired up."
        shell: bash
