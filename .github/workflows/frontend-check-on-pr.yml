name: Check Frontend on PR

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'apps/frontend/**'
      - 'packages/**'
      - '.github/templates/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Reads the pnpm version from the root packageManager field, so the
      # version stays in one place.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter frontend check

      - name: Format check
        run: npx prettier --check .
        working-directory: apps/frontend

      - name: Solid colours
        run: node scripts/check-solid-colours.mjs
        working-directory: apps/frontend

      - name: Background transitions
        run: node scripts/check-background-transitions.mjs
        working-directory: apps/frontend

      # eslint is deliberately absent. The app routes currently carry ~129
      # svelte/no-navigation-without-resolve errors, so adding it here would
      # make this workflow red from the first run. Add the step back once those
      # are cleared.

      - name: Build
        # Prerendering `/` fetches https://api.logdash.io/exposed_config at
        # build time. It is public and needs no secret, but it does mean the
        # build depends on production being reachable.
        run: pnpm --filter frontend build
