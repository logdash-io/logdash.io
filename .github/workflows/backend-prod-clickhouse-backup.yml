# ⚠️ SECURITY - READ BEFORE RE-ENABLING ARTIFACT UPLOAD ⚠️
#
# This repository is PUBLIC. GitHub Actions artifacts on a public repository can be
# downloaded by ANY GitHub user, so uploading a `SELECT * FORMAT Native` dump of every
# ClickHouse table as an artifact publishes the entire production analytics database.
# Encryption is the only thing that stood between that dump and the world, and it is a
# single shared passphrase.
#
# The "Upload Backup Artifact" step below is therefore gated behind an explicit
# `publish_artifact` workflow_dispatch input and is OFF for scheduled runs.
#
# TODO(security): replace the artifact sink with a private object store - push the
# encrypted dump to a private S3/R2 bucket with SSE-KMS and a bucket lifecycle policy,
# authenticating via OIDC role assumption rather than long-lived keys. Until that lands,
# scheduled runs produce NO retained backup: either finish this migration or disable the
# schedule. Do not simply flip `publish_artifact` on.
name: Clickhouse backup (prod)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      publish_artifact:
        description: '⚠️ Upload the encrypted backup as a PUBLICLY DOWNLOADABLE workflow artifact. Leave off unless you understand the exposure.'
        required: false
        default: false
        type: boolean

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ClickHouse Client
        run: |
          curl https://clickhouse.com/ | sh
          sudo ./clickhouse install
        shell: bash

      - name: Create ClickHouse Backup
        run: |
          # Create backup directory
          mkdir -p backup

          # Get current timestamp for backup name
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_NAME="clickhouse_backup_prod_${TIMESTAMP}"

          # Strip http:// prefix from host if present
          CLICKHOUSE_HOST="${{ secrets.BACKEND_PROD_CLICKHOUSE_EXTERNAL_HOST }}"
          CLICKHOUSE_HOST="${CLICKHOUSE_HOST#http://}"
          CLICKHOUSE_HOST="${CLICKHOUSE_HOST#https://}"

          echo "Trying to connect to clickhouse..."

          # Create backup using clickhouse-client
          clickhouse-client \
            --host=${CLICKHOUSE_HOST} \
            --port=${{ secrets.BACKEND_PROD_CLICKHOUSE_PORT_TCP }} \
            --user="${{ secrets.BACKEND_PROD_CLICKHOUSE_USER }}" \
            --password="${{ secrets.BACKEND_PROD_CLICKHOUSE_PASSWORD }}" \
            --database=default \
            --query="SELECT * FROM system.tables WHERE database = 'default' FORMAT TSV" > backup/tables_list.tsv

          echo "Tables list: $(cat backup/tables_list.tsv)"

          # Initialize backup summary
          echo "📊 BACKUP SUMMARY" > backup/backup_summary.txt
          echo "=================" >> backup/backup_summary.txt
          echo "Backup started at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> backup/backup_summary.txt
          echo "" >> backup/backup_summary.txt

          # Backup all tables in default database
          while IFS=$'\t' read -r database table engine; do
            if [ "$database" = "default" ] && [ "$table" != "tables_list" ]; then
              echo "🔧 Backing up table: $table"
              
              # Get row count before backup
              ROW_COUNT=$(./clickhouse client \
                --host="${CLICKHOUSE_HOST}" \
                --port=${{ secrets.BACKEND_PROD_CLICKHOUSE_PORT_TCP }} \
                --user="${{ secrets.BACKEND_PROD_CLICKHOUSE_USER }}" \
                --password="${{ secrets.BACKEND_PROD_CLICKHOUSE_PASSWORD }}" \
                --database=default \
                --query="SELECT COUNT(*) FROM $table")
              
              echo "📋 Table: $table - Rows: $ROW_COUNT"
              echo "Table: $table - Rows: $ROW_COUNT" >> backup/backup_summary.txt
              
              # Backup schema
              ./clickhouse client \
                --host="${CLICKHOUSE_HOST}" \
                --port=${{ secrets.BACKEND_PROD_CLICKHOUSE_PORT_TCP }} \
                --user="${{ secrets.BACKEND_PROD_CLICKHOUSE_USER }}" \
                --password="${{ secrets.BACKEND_PROD_CLICKHOUSE_PASSWORD }}" \
                --database=default \
                --query="SHOW CREATE TABLE $table" > "backup/${table}_schema.sql"
              
              # Backup data
              ./clickhouse client \
                --host="${CLICKHOUSE_HOST}" \
                --port=${{ secrets.BACKEND_PROD_CLICKHOUSE_PORT_TCP }} \
                --user="${{ secrets.BACKEND_PROD_CLICKHOUSE_USER }}" \
                --password="${{ secrets.BACKEND_PROD_CLICKHOUSE_PASSWORD }}" \
                --database=default \
                --query="SELECT * FROM $table FORMAT Native" > "backup/${table}_data.native"
            fi
          done < backup/tables_list.tsv

          # Finalize backup summary
          echo "" >> backup/backup_summary.txt
          echo "Backup completed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> backup/backup_summary.txt

          # Display backup summary
          echo ""
          echo "📊 BACKUP COMPLETED - SUMMARY:"
          echo "=============================="
          cat backup/backup_summary.txt

          # Create metadata file
          echo "backup_timestamp=${TIMESTAMP}" > backup/metadata.txt
          echo "database=default" >> backup/metadata.txt
          echo "environment=prod" >> backup/metadata.txt
          echo "created_at=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> backup/metadata.txt

          # Compress backup
          tar -czf "${BACKUP_NAME}.tar.gz" backup/

          # Set output for artifact name
          echo "BACKUP_NAME=${BACKUP_NAME}" >> $GITHUB_ENV
        shell: bash

      - name: Encrypt Backup
        run: |
          echo "🔐 Encrypting backup artifact..."

          # Make script executable
          chmod +x .github/scripts/encrypt-backup.sh

          # Encrypt the backup
          ./.github/scripts/encrypt-backup.sh \
            "${BACKUP_NAME}.tar.gz" \
            "${BACKUP_NAME}.tar.gz.enc" \
            "${{ secrets.BACKEND_BACKUP_ARTIFACT_KEY }}"

          # Remove unencrypted file for security
          rm -f "${BACKUP_NAME}.tar.gz"

          echo "✅ Backup encrypted and ready for upload"
        shell: bash

      # ⚠️ Publishes production data to a PUBLIC repository's artifact storage.
      # Gated off by default - see the security note at the top of this file.
      - name: Upload Backup Artifact
        if: ${{ inputs.publish_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.tar.gz.enc
          retention-days: 14

      - name: Warn - backup not retained
        if: ${{ !inputs.publish_artifact }}
        run: |
          echo "::warning title=Backup not retained::Artifact upload is disabled because this is a public repository. The backup was created and discarded. See the TODO at the top of .github/workflows/backend-prod-clickhouse-backup.yml - a private S3/R2 sink still needs to be wired up."
        shell: bash
