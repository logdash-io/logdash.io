name: Deploy

inputs:
  # SSH
  host:
    required: true
  username:
    required: true
  port:
    required: true
  ssh-private-key:
    required: true

  # Docker
  image-name:
    required: true
  server-port:
    required: true
  container-name:
    required: true
  application-port:
    required: true

  # App
  mongo-url:
    required: true
  github-oauth-client-id:
    required: true
  github-oauth-client-secret:
    required: true
  github-oauth-client-id-alternative:
    required: false
  github-oauth-client-secret-alternative:
    required: false
  resend-api-key:
    required: true
  resend-audience-enabled:
    required: true
  stripe-api-key-secret:
    required: true
  stripe-signature:
    required: true
  our-env:
    required: true

  redis-url:
    required: true
  redis-socket-path:
    required: false
  redis-password:
    required: false

  stripe-early-bird-price-id:
    required: true
  stripe-builder-price-id:
    required: true
  stripe-pro-price-id:
    required: true
  demo-dashboard-api-key:
    required: true
  logdash-api-key:
    required: true
  telegram-token:
    required: true
  whitelisted-emails:
    required: true
  auth-jwt-secret:
    required: true
  personal-api-key-hmac-secret:
    required: true

  clickhouse-host:
    required: true
  clickhouse-port:
    required: false
  clickhouse-user:
    required: true
  clickhouse-password:
    required: true
  clickhouse-database:
    required: true

  swagger-password:
    required: true
  telegram-uptime-bot-token:
    required: true
  telegram-uptime-bot-secret:
    required: true

  admin-super-secret-admin-key:
    required: true

  internal-telegram-bot-token:
    required: true

  google-oauth-client-id:
    required: true
  google-oauth-client-secret:
    required: true
  google-oauth-client-id-local:
    required: false
  google-oauth-client-secret-local:
    required: false
  github-oauth-client-id-local:
    required: false
  github-oauth-client-secret-local:
    required: false
  google-oauth-redirect-uri-local:
    required: false
  watchlist-project-id:
    required: false

runs:
  using: 'composite'
  steps:
    - name: Update image inside VPS
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      with:
        host: ${{ inputs.host }}
        USERNAME: ${{ inputs.username }}
        PORT: ${{ inputs.port }}
        KEY: ${{ inputs.ssh-private-key }}
        script: |
          set -e
          umask 077
          mkdir -p ~/logdash
          ENV_FILE=~/logdash/${{ inputs.container-name }}.env
          cat > "$ENV_FILE" <<'EOF'
          MONGO_URL=${{ inputs.mongo-url }}
          GITHUB_OAUTH_CLIENT_ID=${{ inputs.github-oauth-client-id }}
          GITHUB_OAUTH_CLIENT_SECRET=${{ inputs.github-oauth-client-secret }}
          GITHUB_OAUTH_CLIENT_ID_ALTERNATIVE=${{ inputs.github-oauth-client-id-alternative }}
          GITHUB_OAUTH_CLIENT_SECRET_ALTERNATIVE=${{ inputs.github-oauth-client-secret-alternative }}
          RESEND_API_KEY=${{ inputs.resend-api-key }}
          STRIPE_API_KEY_SECRET=${{ inputs.stripe-api-key-secret }}
          STRIPE_SIGNATURE=${{ inputs.stripe-signature }}
          OUR_ENV=${{ inputs.our-env }}
          REDIS_URL=${{ inputs.redis-url }}
          REDIS_SOCKET_PATH=${{ inputs.redis-socket-path }}
          REDIS_PASSWORD=${{ inputs.redis-password }}
          STRIPE_EARLY_BIRD_PRICE_ID=${{ inputs.stripe-early-bird-price-id }}
          STRIPE_BUILDER_PRICE_ID=${{ inputs.stripe-builder-price-id }}
          STRIPE_PRO_PRICE_ID=${{ inputs.stripe-pro-price-id }}
          DEMO_DASHBOARD_API_KEY=${{ inputs.demo-dashboard-api-key }}
          LOGDASH_API_KEY=${{ inputs.logdash-api-key }}
          TELEGRAM_TOKEN=${{ inputs.telegram-token }}
          WHITELISTED_EMAILS=${{ inputs.whitelisted-emails }}
          AUTH_JWT_SECRET=${{ inputs.auth-jwt-secret }}
          PERSONAL_API_KEY_HMAC_SECRET=${{ inputs.personal-api-key-hmac-secret }}
          CLICKHOUSE_HOST=${{ inputs.clickhouse-host }}
          CLICKHOUSE_PORT=${{ inputs.clickhouse-port }}
          CLICKHOUSE_USER=${{ inputs.clickhouse-user }}
          CLICKHOUSE_PASSWORD=${{ inputs.clickhouse-password }}
          CLICKHOUSE_DATABASE=${{ inputs.clickhouse-database }}
          SWAGGER_PASSWORD=${{ inputs.swagger-password }}
          TELEGRAM_UPTIME_BOT_TOKEN=${{ inputs.telegram-uptime-bot-token }}
          TELEGRAM_UPTIME_BOT_SECRET=${{ inputs.telegram-uptime-bot-secret }}
          ADMIN_SUPER_SECRET_ADMIN_KEY=${{ inputs.admin-super-secret-admin-key }}
          INTERNAL_TELEGRAM_BOT_TOKEN=${{ inputs.internal-telegram-bot-token }}
          GOOGLE_OAUTH_CLIENT_ID=${{ inputs.google-oauth-client-id }}
          GOOGLE_OAUTH_CLIENT_SECRET=${{ inputs.google-oauth-client-secret }}
          GOOGLE_OAUTH_CLIENT_ID_LOCAL=${{ inputs.google-oauth-client-id-local }}
          GOOGLE_OAUTH_CLIENT_SECRET_LOCAL=${{ inputs.google-oauth-client-secret-local }}
          GITHUB_OAUTH_CLIENT_ID_LOCAL=${{ inputs.github-oauth-client-id-local }}
          GITHUB_OAUTH_CLIENT_SECRET_LOCAL=${{ inputs.github-oauth-client-secret-local }}
          GOOGLE_OAUTH_REDIRECT_URI_LOCAL=${{ inputs.google-oauth-redirect-uri-local }}
          WATCHLIST_PROJECT_ID=${{ inputs.watchlist-project-id }}
          SHUTDOWN_DRAIN_MS=5000
          EOF

          # The zero-downtime deploy script is installed on the server from the infrastructure repo.
          if [ -x /usr/local/bin/logdash-deploy-backend ]; then
            /usr/local/bin/logdash-deploy-backend ${{ inputs.container-name }} ${{ inputs.image-name }} "$ENV_FILE"
          else
            echo "::warning::Zero-downtime deploy script not installed, replacing the container in place"
            docker pull ${{ inputs.image-name }}
            # Builds with /health flush their queues on SIGTERM. Older ones keep accepting logs without
            # flushing until Docker kills them, so they are killed right away.
            for container in $(docker ps -q --filter "name=^${{ inputs.container-name }}"); do
              if docker exec "$container" wget -qO /dev/null http://localhost:${{ inputs.application-port }}/health; then
                docker stop -t 30 "$container"
              fi
            done
            docker ps -aq --filter "name=^${{ inputs.container-name }}" | xargs -r docker rm -f
            docker run -d \
            -p ${{ inputs.server-port }}:${{ inputs.application-port }} \
            --restart=always \
            --add-host=host.docker.internal:host-gateway \
            --name ${{ inputs.container-name }} \
            -v /var/run/dragonfly:/var/run/dragonfly \
            --env-file "$ENV_FILE" \
            ${{ inputs.image-name }}
          fi
