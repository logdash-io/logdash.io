name: Deploy

inputs:
  # SSH
  host:
    required: true
  username:
    required: true
  port:
    required: true
  ssh-private-key:
    required: true

  # Docker
  image-name:
    required: true
  server-port:
    required: true
  container-name:
    required: true
  application-port:
    required: true
  api-base-url:
    required: false
  logdash-api-key:
    required: true

runs:
  using: 'composite'
  steps:
    - name: Update image inside VPS
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      with:
        host: ${{ inputs.host }}
        USERNAME: ${{ inputs.username }}
        PORT: ${{ inputs.port }}
        KEY: ${{ inputs.ssh-private-key }}
        script: |
          set -e
          umask 077
          mkdir -p ~/logdash
          ENV_FILE=~/logdash/${{ inputs.container-name }}.env
          cat > "$ENV_FILE" <<'EOF'
          VITE_API_BASE_URL=${{ inputs.api-base-url }}
          LOGDASH_API_KEY=${{ inputs.logdash-api-key }}
          SHUTDOWN_TIMEOUT=5
          EOF
          docker pull ${{ inputs.image-name }}
          # SIGTERM first, so the server flushes its queued logs before it exits.
          docker stop -t 10 ${{ inputs.container-name }} || true
          docker rm -f ${{ inputs.container-name }} || true
          docker run -d \
          -p ${{ inputs.server-port }}:${{ inputs.application-port }} \
          --restart=always \
          --name ${{ inputs.container-name }} \
          --env-file "$ENV_FILE" \
          ${{ inputs.image-name }}
